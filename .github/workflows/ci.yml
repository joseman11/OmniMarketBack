name: OmniMarket Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  # A newer push cancels an older run, except on main: a production deploy is never cut off halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Exact CLI version for reproducible deploys; bump deliberately.
  VERCEL_CLI_VERSION: 63.1.2

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Unit tests replace Prisma with an in-memory mock; prisma generate only needs a well-formed URL.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused?schema=public
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build API
        run: npm run build

  e2e:
    name: E2E (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omnimarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d omnimarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3001"
      DATABASE_URL: postgresql://test:test@localhost:5432/omnimarket_test?schema=public
      API_ORIGIN: http://127.0.0.1:3001
      WEB_ORIGIN: http://127.0.0.1:3000
      TEST_API_TOKEN: ci-only-token-8d3819c9-5c63-4d5d-a329-a3886b8f018c
      E2E_TEST_AUTH: "true"
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply schema migrations
        run: npm run db:migrate

      - name: Seed repeatable E2E data
        run: npm run db:seed

      - name: Build API
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run backend E2E flows
        run: npm run test:e2e

  # Single required check for branch protection and Vercel Deployment Checks: passes only if every gate passed.
  ci-gate:
    name: Backend CI Gate
    if: always()
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require backend checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo "The required backend checks did not pass."
            exit 1
          fi

  # Production deploys only from CI, after both gates pass. Requires Git auto-deploys of production to be
  # disabled in Vercel (see docs/DEPLOY.md); otherwise Vercel would still deploy main on its own.
  deploy:
    name: Deploy to Vercel (production)
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: backend-vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production settings and environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Runs the project's vercel-build script, which applies pending Prisma migrations for production builds.
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${url}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test (public URL)
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Stable public domain (repository variable). The per-deployment URL is the fallback, but Vercel
      # Deployment Protection may answer 401 there.
      PUBLIC_URL: ${{ vars.PRODUCTION_URL || needs.deploy.outputs.url }}
    steps:
      - name: Audit endpoints answer 200
        run: |
          base="${PUBLIC_URL%/}"
          case "$base" in http*) ;; *) base="https://${base}" ;; esac
          failed=0
          for path in "/api/test/analytics?page=1&limit=50" "/api/test/kanban-status?orderNumber=OM-TEST-1001"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors --max-time 20 "${base}${path}" || true)"
            echo "${path} -> ${status}"
            [ "$status" = "200" ] || failed=1
          done
          exit "$failed"
